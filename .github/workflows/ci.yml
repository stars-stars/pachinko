name: Data Processing and Deploy

# ワークフローを実行するトリガーを定義
on:
  # mainブランチにプッシュがあった時に実行
  push:
    branches:
      - main
    paths:
      - 'data/day_datas.csv'
      - '**.py' 
      - '**.js'
      - '**.html'
      - '**.css'
  # イシューに投稿された時に実行
  issues:
    types: opened
  # 任意のタイミングで手動実行を可能にする
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Issueからデータを読み取り、csvへ保存する
      - name: Extract Issue message
        id: extract_message
        if: ${{ github.event_name == 'issues' }}
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"
          echo "title=$(echo "$ISSUE_TITLE" | sed 's/"/\\"/g')" >> $GITHUB_OUTPUT
          echo "content=$(echo "$ISSUE_BODY" | sed 's/"/\\"/g')" >> $GITHUB_OUTPUT
      - name: Add data process
        if: ${{ steps.extract_message.outputs.title == 'Add' }}
        # 抽出した内容をファイルに書き込む
        run: |
          echo "${{ steps.extract_message.outputs.content }}" > content.txt
          echo "---追加データ---"
          cat content.txt
          echo "${{ steps.extract_message.outputs.content }}" >> data/day_datas.csv
      - name: Delete data process
        if: ${{ steps.extract_message.outputs.title == 'Delete' }}
        run: |
          # 抽出した内容をファイルに書き込む（例: content.txt）
          echo "${{ steps.extract_message.outputs.content }}" > content.txt
          # 変更を確認
          cat content.txt
          
        
      # 1. リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4
        
      # 2. Python環境をセットアップ (3.11を使用)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      # 3. 必要なライブラリをインストール
      # (PandasやMatplotlibなど、スクリプトで使うライブラリを記述)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib japanize_matplotlib
          
      # 4. 収支データを処理・集計するPythonスクリプトを実行
      - name: Run data aggregation scripts
        run: |
          python sorting.py
          python summary_data.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

  # デプロイ
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4