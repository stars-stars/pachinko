name: Data Processing and Deploy

# ワークフローを実行するトリガーを定義
on:
  # mainブランチにプッシュがあった時に実行
  push:
    branches:
      - main
    paths:
      - 'data/day_datas.csv'
      - '**.py' 
      - '**.js'
      - '**.html'
      - '**.css'
  # イシューに投稿された時に実行
  issues:
    types: [opened]
  # 任意のタイミングで手動実行を可能にする
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4
      # Issueからデータを読み取り、csvへ保存する
      - name: Extract Issue message
        id: extract_message
        if: ${{ github.event_name == 'issues' }}
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"
          echo "title=$(echo '$ISSUE_TITLE')" >> $GITHUB_OUTPUT
          echo "content=$(echo '$ISSUE_BODY')" >> $GITHUB_OUTPUT
      # 追加の処理
      - name: Add data process
        if: ${{ steps.extract_message.outputs.title == 'Add' }}
        run: |
          echo "${{ steps.extract_message.outputs.content }}" > content.txt
          echo "---追加データ---"
          cat content.txt
          echo "${{ steps.extract_message.outputs.content }}" >> data/day_datas.csv
      # 削除の処理
      - name: Delete data process
        if: ${{ steps.extract_message.outputs.title == 'Delete' }}
        run: |
          # 抽出した内容をファイルに書き込む（例: content.txt）
          echo "${{ steps.extract_message.outputs.content }}" > content.txt
          # 変更を確認
          cat content.txt
        
      # Python環境をセットアップ (3.11を使用)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      # 必要なライブラリをインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib japanize_matplotlib
          
      # 収支データを処理・集計するPythonスクリプトを実行
      - name: Run data aggregation scripts
        run: |
          python sorting.py
          python summary_data.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'
      # 変更内容をブランチに反映する
      - name: commit change
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "update all with GitHub Actions"
          git push

  # デプロイ
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4