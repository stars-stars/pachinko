name: 日毎データの追加 (表形式)
description: 表（テーブル）形式で日毎データを追加する際に使用するテンプレートです。
title: "Add day-data"
labels: "AddDayData"

body:
  - type: markdown
    attributes:
      value: |
        ## データの追加
        以下の表の各セルに日付、機種、投資額、回収額を入力してください。
        **Tabキー** を押すと次のセルへスムーズに移動できます。
        入力のない行（空の行）は無視されるため、10行すべて埋める必要はありません。

  - type: textarea
    id: additional_datas
    attributes:
      label: 追加データリスト
      description: "※ 日付は YYYY-MM-DD の形式で入力してください"
      value: |
        | 日付 | 機種名 | 投資額 | 回収額 |
        |---|---|---|---|
        | | | | |
        | | | | |
        | | | | |
        | | | | |
        | | | | |
        | | | | |
        | | | | |
        | | | | |
        | | | | |
        | | | | |
    validations:
      required: true

