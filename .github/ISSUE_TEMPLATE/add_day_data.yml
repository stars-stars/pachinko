name: 日毎データの追加 (個別入力)
description: 入力項目が独立しており、Tabキーで次へ移動できるテンプレートです。
title: Add day-data
labels:
- AddDayData
body:
- type: markdown
  attributes:
    value: '## データの追加

      GitHubの仕様上、入力欄は横ではなく縦に並びますが、**Tabキー**で次の項目へ素早く移動できます。

      不要な行（空欄）は無視されるため、入力データ分だけ埋めてください。

      ※機種名について、新しい機種はそのまま手入力してください。既存の機種はページ下部の一覧を参考にしてください。'
- type: input
  id: date_1
  attributes:
    label: '[1行目] 日付'
    placeholder: YYYY-MM-DD
- type: input
  id: machine_1
  attributes:
    label: '[1行目] 機種名'
    placeholder: '例: ジャグラー (新しい機種も入力可能)'
- type: input
  id: inv_1
  attributes:
    label: '[1行目] 投資額'
    placeholder: '例: 1000'
- type: input
  id: ret_1
  attributes:
    label: '[1行目] 回収額'
    placeholder: '例: 1000'
