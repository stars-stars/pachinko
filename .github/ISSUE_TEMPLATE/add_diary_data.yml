name: 日記データの追加
description: 日記データを追加する際に使用するテンプレートです。
title: "Add diary-data"
labels: "AddDiaryData"

body:
  - type: markdown
    attributes:
      value: |
        ## データの追加
        日記データを追加するフォームです

  - type: input
    id: date
    attributes:
      label: 日付
      placeholder: |
        2025-01-01
    validations:
      required: true

  - type: textarea
    id: additional_datas
    attributes:
      label: 追加の日記データ
      placeholder: |
        日記の内容
    validations:
      required: true
