<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" lang="ja">
        <title>スターのパチンコレポート/全体収支</title>
        <link rel="stylesheet" href="page-style.css">
    </head>
    <body>
        <div class="pachinko">
            <header>
                <ul>
                    <li><a href="home.html">ホーム</a></li>
                    <li><a href="sum.html" style="color: black;">全体収支</a></li>
                    <li><a href="days.html">日ごと収支</a></li>
                    <li><a href="diary.html">日記</a></li>
                    <li><a href="profile.html">プロフィール</a></li>
                </ul>
            </header>
            <div class="contents">
                <div class="sum">
                    <h2>パチンコ・パチスロ総合収支</h2>
                    <h1><span id="total-profit">...</span></h1>
                    <h3><span id="today">...</span></h3>
                    <img src="data/daily_cumulative_graph.png" alt="総合収支の推移">
                    <div class="days">
                        <!--機種ごと収支-->
                        <table width="1200" border="3">
                            <caption>機種ごと収支</caption>
                            <thead>
                                <tr>
                                    <th>機種</th>
                                    <th>収支</th>
                                </tr>
                            </thead>
                            <tbody id="machine-summary-body"></tbody>
                        </table>
                        <img src="data/machine_profit_bar.png" alt="機種別収支">
                        <!--月ごと収支-->
                        <table width="1200" border="3">
                            <caption>月ごと収支</caption>
                            <thead>
                                <tr>
                                    <th>年/月</th>
                                    <th>収支</th>
                                </tr>
                            </thead>
                            <tbody id="monthly-summary-body"></tbody>
                        </table>
                        <img src="data/monthly_bar_graph.png" alt="月別収支">
                    </div>
                </div>
            </div>
        </div>
        <script src="update_data.js"></script>
    </body>
</html>
