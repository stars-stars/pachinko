<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>スターのパチンコレポート/全体収支</title>
        <link rel="stylesheet" href="page-style.css">
    </head>
    <body>
        <div class="pachinko">
            <header></header>
            <div class="contents">
                <div class="sum">
                    <h2>パチンコ・パチスロ総合収支</h2>
                    <h1><span id="total-profit">...</span></h1>
                    <h3><span id="today">...</span></h3>
                    <!--統計カード-->
                    <div id="stats-cards" class="stats-cards"></div>
                    <div class="chart-box">
                        <canvas id="cumulative-chart" aria-label="総合収支の推移"></canvas>
                    </div>
                    <div class="days">
                        <!--機種別収支-->
                        <div class="table-title">機種別収支</div>
                        <div class="sort-controls">
                            <label for="machine-sort-key">並び替え:</label>
                            <select id="machine-sort-key">
                                <option value="profit" selected>収支</option>
                                <option value="sessions">回数</option>
                                <option value="win_rate">勝率</option>
                                <option value="machine">機種名</option>
                            </select>
                            <select id="machine-sort-order" aria-label="機種別収支の並び順">
                                <option value="desc" selected>降順</option>
                                <option value="asc">昇順</option>
                            </select>
                        </div>
                        <div class="table-responsive">
                            <table class="data-table" border="3">
                                <thead>
                                    <tr>
                                        <th>機種</th>
                                        <th>回数</th>
                                        <th>勝率</th>
                                        <th>収支</th>
                                    </tr>
                                </thead>
                                <tbody id="machine-summary-body"></tbody>
                            </table>
                        </div>
                        <div class="chart-box">
                            <canvas id="machine-chart" aria-label="機種別収支"></canvas>
                        </div>
                        <!--月別収支-->
                        <div class="table-title">月別収支</div>
                        <div class="sort-controls">
                            <label for="monthly-sort-key">並び替え:</label>
                            <select id="monthly-sort-key">
                                <option value="month" selected>日付</option>
                                <option value="profit">収支</option>
                            </select>
                            <select id="monthly-sort-order" aria-label="月別収支の並び順">
                                <option value="asc" selected>昇順</option>
                                <option value="desc">降順</option>
                            </select>
                        </div>
                        <div class="table-responsive">
                            <table class="data-table" border="3">
                                <thead>
                                    <tr>
                                        <th>年/月</th>
                                        <th>収支</th>
                                    </tr>
                                </thead>
                                <tbody id="monthly-summary-body"></tbody>
                            </table>
                        </div>
                        <div class="chart-box">
                            <canvas id="monthly-chart" aria-label="月別収支"></canvas>
                        </div>
                        <!--年ごと収支-->
                        <div class="table-responsive">
                            <table class="data-table" border="3">
                                <caption>年ごと収支</caption>
                                <thead>
                                    <tr>
                                        <th>年</th>
                                        <th>収支</th>
                                    </tr>
                                </thead>
                                <tbody id="yearly-summary-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
        <script src="common.js"></script>
        <script src="update_data.js"></script>
    </body>
</html>
