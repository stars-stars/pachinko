<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>スターのパチンコレポート/日ごと収支</title>
        <link rel="stylesheet" href="page-style.css">
    </head>
    <body>
        <div class="pachinko">
            <header></header>
            <div class="contents">
                <div class="days">
                    <h1>日別収支一覧</h1>

                    <!-- 期間・機種指定フィルター -->
                    <div class="filter-wrapper">
                        <div class="filter-container">
                            <div class="filter-row">
                                <label for="start-date">開始日:</label>
                                <input type="date" id="start-date">
                                <span class="filter-separator">〜</span>
                                <label for="end-date">終了日:</label>
                                <input type="date" id="end-date">
                            </div>
                            <div class="filter-row">
                                <label for="machine-filter">機種:</label>
                                <select id="machine-filter">
                                    <option value="">すべて</option>
                                </select>
                                <button id="clear-btn" class="btn-clear">クリア</button>
                            </div>
                            <div>
                                <button id="filter-btn" class="btn-filter">絞り込み</button>
                            </div>

                            <div id="period-summary" class="period-summary">
                                期間合計収支: <span id="period-total">0.0</span>k
                                <span id="period-detail" class="period-detail"></span>
                            </div>
                        </div>
                    </div>

                    <p id="loading-status">データを読み込み中...</p>
                    <div id="data-container"></div>
                </div>
            </div>
        </div>
        <script src="common.js"></script>
        <script src="day_data_embed.js"></script>
    </body>
</html>
